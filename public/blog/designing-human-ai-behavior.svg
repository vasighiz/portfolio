<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Designing Human-AI Behavior</title>
  <desc id="desc">Comparison of a traditional workflow with an agent-native workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#e9eef5"/>
      <stop offset="50%" stop-color="#f7f8fb"/>
      <stop offset="100%" stop-color="#fff8f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0a192f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="92" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" fill="#0a192f">Designing Human-AI Behavior</text>
  <text x="800" y="142" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" fill="#526079">Same goal. A fundamentally different experience.</text>

  <line x1="800" y1="180" x2="800" y2="820" stroke="#aeb8c8" stroke-width="2"/>

  <text x="390" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#0a192f">Traditional workflow</text>
  <text x="390" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#526079">Multiple systems. Manual work. Higher friction.</text>

  <g font-family="Inter, Arial, sans-serif" fill="#0a192f" text-anchor="middle">
    <circle cx="145" cy="350" r="34" fill="#ffffff" stroke="#cfd7e4"/>
    <text x="145" y="358" font-size="26">1</text>
    <text x="145" y="405" font-size="20">Find system</text>

    <line x1="185" y1="350" x2="265" y2="350" stroke="#728096" stroke-width="3"/>
    <polygon points="265,350 252,341 252,359" fill="#728096"/>

    <circle cx="325" cy="350" r="34" fill="#ffffff" stroke="#cfd7e4"/>
    <text x="325" y="358" font-size="26">2</text>
    <text x="325" y="405" font-size="20">Fill forms</text>

    <line x1="365" y1="350" x2="445" y2="350" stroke="#728096" stroke-width="3"/>
    <polygon points="445,350 432,341 432,359" fill="#728096"/>

    <circle cx="505" cy="350" r="34" fill="#ffffff" stroke="#cfd7e4"/>
    <text x="505" y="358" font-size="26">3</text>
    <text x="505" y="405" font-size="20">Provide info</text>

    <line x1="545" y1="350" x2="625" y2="350" stroke="#728096" stroke-width="3"/>
    <polygon points="625,350 612,341 612,359" fill="#728096"/>

    <circle cx="685" cy="350" r="34" fill="#ffffff" stroke="#cfd7e4"/>
    <text x="685" y="358" font-size="26">4</text>
    <text x="685" y="405" font-size="20">Wait & follow up</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="115" y="475" rx="22" ry="22" width="555" height="245" fill="#ffffff"/>
    <rect x="145" y="505" rx="12" ry="12" width="210" height="74" fill="#e8eef7"/>
    <text x="170" y="550" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#25324a">Email</text>
    <rect x="380" y="505" rx="12" ry="12" width="240" height="74" fill="#edf1f7"/>
    <text x="405" y="550" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#25324a">Form</text>
    <rect x="145" y="603" rx="12" ry="12" width="210" height="74" fill="#f3f5f8"/>
    <text x="170" y="648" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#25324a">Requests</text>
    <rect x="380" y="603" rx="12" ry="12" width="240" height="74" fill="#f6f7f9"/>
    <text x="405" y="648" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#25324a">Status / follow-up</text>
  </g>

  <text x="1210" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#5f5cf5">Agent-native workflow</text>
  <text x="1210" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#526079">A simple conversation. The agent prepares. You decide.</text>

  <g font-family="Inter, Arial, sans-serif" fill="#0a192f" text-anchor="middle">
    <circle cx="925" cy="350" r="34" fill="#f0efff" stroke="#c8c6ff"/>
    <text x="925" y="358" font-size="26">1</text>
    <text x="925" y="405" font-size="20">Set goal</text>

    <line x1="965" y1="350" x2="1045" y2="350" stroke="#5f5cf5" stroke-width="3"/>
    <polygon points="1045,350 1032,341 1032,359" fill="#5f5cf5"/>

    <circle cx="1105" cy="350" r="34" fill="#f0efff" stroke="#c8c6ff"/>
    <text x="1105" y="358" font-size="26">2</text>
    <text x="1105" y="405" font-size="20">Agent prepares</text>

    <line x1="1145" y1="350" x2="1225" y2="350" stroke="#5f5cf5" stroke-width="3"/>
    <polygon points="1225,350 1212,341 1212,359" fill="#5f5cf5"/>

    <circle cx="1285" cy="350" r="34" fill="#f0efff" stroke="#c8c6ff"/>
    <text x="1285" y="358" font-size="26">3</text>
    <text x="1285" y="405" font-size="20">You decide</text>

    <line x1="1325" y1="350" x2="1405" y2="350" stroke="#5f5cf5" stroke-width="3"/>
    <polygon points="1405,350 1392,341 1392,359" fill="#5f5cf5"/>

    <circle cx="1465" cy="350" r="34" fill="#f0efff" stroke="#c8c6ff"/>
    <text x="1465" y="358" font-size="26">4</text>
    <text x="1465" y="405" font-size="20">Agent executes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="905" y="475" rx="24" ry="24" width="560" height="245" fill="#ffffff"/>
    <text x="940" y="522" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0a192f">AI Agent</text>
    <rect x="1090" y="538" rx="18" ry="18" width="330" height="48" fill="#efefff"/>
    <text x="1115" y="570" font-family="Inter, Arial, sans-serif" font-size="18" fill="#39425a">I need to do X for this customer.</text>
    <rect x="940" y="606" rx="14" ry="14" width="455" height="82" fill="#f7f8fb" stroke="#e3e7ee"/>
    <text x="965" y="638" font-family="Inter, Arial, sans-serif" font-size="18" fill="#39425a">I’ll gather what I can and ask only</text>
    <text x="965" y="664" font-family="Inter, Arial, sans-serif" font-size="18" fill="#39425a">for what’s missing.</text>
  </g>

  <rect x="770" y="488" width="60" height="60" rx="30" fill="#5f5cf5"/>
  <path d="M790 518h24m-9-9 9 9-9 9" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>