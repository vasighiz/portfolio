<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f8fb"/><text x="800" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#0a192f">Designing Human-AI Behavior</text><text x="800" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#526079">Same goal. A fundamentally different experience.</text><line x1="800" y1="200" x2="800" y2="820" stroke="#c2cad6" stroke-width="2"/><text x="400" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0a192f">Traditional workflow</text><text x="400" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#526079">Multiple systems · Manual work · Higher friction</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="140" cy="390" r="38" fill="#fff" stroke="#cfd7e4"/><text x="140" y="400" font-size="26" fill="#0a192f">1</text><text x="140" y="455" font-size="21" fill="#0a192f">Find system</text><text x="235" y="400" font-size="34" fill="#728096">→</text><circle cx="330" cy="390" r="38" fill="#fff" stroke="#cfd7e4"/><text x="330" y="400" font-size="26" fill="#0a192f">2</text><text x="330" y="455" font-size="21" fill="#0a192f">Fill forms</text><text x="425" y="400" font-size="34" fill="#728096">→</text><circle cx="520" cy="390" r="38" fill="#fff" stroke="#cfd7e4"/><text x="520" y="400" font-size="26" fill="#0a192f">3</text><text x="520" y="455" font-size="21" fill="#0a192f">Provide info</text><text x="615" y="400" font-size="34" fill="#728096">→</text><circle cx="710" cy="390" r="38" fill="#fff" stroke="#cfd7e4"/><text x="710" y="400" font-size="26" fill="#0a192f">4</text><text x="710" y="455" font-size="21" fill="#0a192f">Wait & follow up</text></g><rect x="125" y="525" width="550" height="185" rx="24" fill="#fff" stroke="#dfe5ee"/><text x="160" y="575" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#25324a">Email</text><text x="400" y="575" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#25324a">Forms</text><text x="160" y="635" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#25324a">Requests</text><text x="400" y="635" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#25324a">Status / follow-up</text><text x="1200" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#5f5cf5">Agent-native workflow</text><text x="1200" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#526079">Conversation · Agent prepares · Human decides</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="890" cy="390" r="38" fill="#efefff" stroke="#c8c6ff"/><text x="890" y="400" font-size="26" fill="#0a192f">1</text><text x="890" y="455" font-size="21" fill="#0a192f">Set goal</text><text x="985" y="400" font-size="34" fill="#5f5cf5">→</text><circle cx="1080" cy="390" r="38" fill="#efefff" stroke="#c8c6ff"/><text x="1080" y="400" font-size="26" fill="#0a192f">2</text><text x="1080" y="455" font-size="21" fill="#0a192f">Agent prepares</text><text x="1175" y="400" font-size="34" fill="#5f5cf5">→</text><circle cx="1270" cy="390" r="38" fill="#efefff" stroke="#c8c6ff"/><text x="1270" y="400" font-size="26" fill="#0a192f">3</text><text x="1270" y="455" font-size="21" fill="#0a192f">Human decides</text><text x="1365" y="400" font-size="34" fill="#5f5cf5">→</text><circle cx="1460" cy="390" r="38" fill="#efefff" stroke="#c8c6ff"/><text x="1460" y="400" font-size="26" fill="#0a192f">4</text><text x="1460" y="455" font-size="21" fill="#0a192f">Agent executes</text></g><rect x="925" y="525" width="550" height="185" rx="24" fill="#fff" stroke="#dfe5ee"/><text x="960" y="575" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0a192f">AI Agent</text><rect x="1020" y="605" width="390" height="62" rx="18" fill="#efefff"/><text x="1215" y="644" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#39425a">Tell me the goal. I’ll prepare the path.</text><circle cx="800" cy="620" r="35" fill="#5f5cf5"/><text x="800" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" fill="#fff">→</text></svg>